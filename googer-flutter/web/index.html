<!DOCTYPE html>
<html>
<head>
  <!-- Kill any stale service worker / caches from older PWA builds. This app
       ships with pwa-strategy=none, so no service worker should ever control
       it; an old one otherwise keeps serving an outdated bundle. -->
  <script>
    (function () {
      try {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          (regs || []).forEach(function (r) { r.unregister(); });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
          // Reload only when a worker is actually *controlling* this page —
          // that is the case where the bundle on screen came from its cache.
          // Guarded by a timestamp rather than a one-shot session flag: a tab
          // left open for days would otherwise never heal again after its
          // first purge.
          var controlled = !!navigator.serviceWorker.controller;
          var last = Number(sessionStorage.getItem('gsw_purged_at') || 0);
          if (controlled && Date.now() - last > 10000) {
            sessionStorage.setItem('gsw_purged_at', String(Date.now()));
            location.reload();
          }
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="googer_app">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>googer_app</title>
  <link rel="manifest" href="manifest.json">
