services:
  gateway:
    image: caddy:2.9-alpine
    profiles: ["edge-gateway"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      main-frontend:
        condition: service_started
      main-backend:
        condition: service_started
      admin-app:
        condition: service_started
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-googer}
      POSTGRES_USER: ${POSTGRES_USER:-googer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-googer_password_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-googer} -d ${POSTGRES_DB:-googer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  main-backend:
    build:
      context: .
      dockerfile: docker/main-backend.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      MOBILE_URL: ${MOBILE_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-googer}
      DB_USER: ${DB_USER:-googer}
      DB_PASSWORD: ${DB_PASSWORD:-googer_password_change_me}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-2}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-googer-internal-dev-token}
      OPS_MONITOR_TOKEN: ${OPS_MONITOR_TOKEN:-googer-ops-monitor-token}
      SERVICE_CONTRACT_MODE: ${SERVICE_CONTRACT_MODE:-strict}
      SERVICE_ROUTE_OWNERSHIP_MODE: ${SERVICE_ROUTE_OWNERSHIP_MODE:-strict}
      MEDIA_SERVICE_URL: ${MEDIA_SERVICE_URL:-http://media-service:5003}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:5004}
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-http://chat-service:5005}
      FEED_SERVICE_URL: ${FEED_SERVICE_URL:-http://feed-service:5006}
      MARKETPLACE_SERVICE_URL: ${MARKETPLACE_SERVICE_URL:-http://marketplace-service:5007}
      ADS_SERVICE_URL: ${ADS_SERVICE_URL:-http://ads-service:5008}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL:-http://account-service:5009}
      ORDERS_SERVICE_URL: ${ORDERS_SERVICE_URL:-http://orders-service:5010}
      FINANCE_SERVICE_URL: ${FINANCE_SERVICE_URL:-http://finance-service:5011}
      PUBLIC_UPLOAD_CONTENT_CACHE_TTL_MS: ${PUBLIC_UPLOAD_CONTENT_CACHE_TTL_MS:-15000}
      WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-120}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - main-uploads:/app/googernew/public/uploads
    depends_on:
      media-service:
        condition: service_started
      notification-service:
        condition: service_started
      chat-service:
        condition: service_started
      feed-service:
        condition: service_started
      marketplace-service:
        condition: service_started
      ads-service:
        condition: service_started
      account-service:
        condition: service_started
      orders-service:
        condition: service_started
      finance-service:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  main-worker:
    build:
      context: .
      dockerfile: docker/main-backend.Dockerfile
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-googer}
      DB_USER: ${DB_USER:-googer}
      DB_PASSWORD: ${DB_PASSWORD:-googer_password_change_me}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-5}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      WORKER_ID: main-worker-1
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-googer-internal-dev-token}
      OPS_MONITOR_TOKEN: ${OPS_MONITOR_TOKEN:-googer-ops-monitor-token}
      SERVICE_CONTRACT_MODE: ${SERVICE_CONTRACT_MODE:-strict}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:5004}
    volumes:
      - main-uploads:/app/googernew/public/uploads
    depends_on:
      main-backend:
        condition: service_started
      redis:
        condition: service_healthy

  media-service:
    build:
      context: .
      dockerfile: docker/media-service.Dockerfile
    environment:
      NODE_ENV: production
      MEDIA_SERVICE_PORT: 5003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-googer-internal-dev-token}
      OPS_MONITOR_TOKEN: ${OPS_MONITOR_TOKEN:-googer-ops-monitor-token}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      FORCE_LOCAL_UPLOADS: ${FORCE_LOCAL_UPLOADS:-false}
      UPLOADS_DIR: /app/googernew/public/uploads
    ports:
      - "127.0.0.1:5003:5003"
    volumes:
      - main-uploads:/app/googernew/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
