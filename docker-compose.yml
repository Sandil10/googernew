    depends_on:
      notification-service:
        condition: service_started
      redis:
        condition: service_healthy

  main-frontend:
    build:
      context: .
      dockerfile: docker/main-frontend.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://main-backend:5000
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      main-backend:
        condition: service_started

  admin-app:
    build:
      context: ${ADMIN_BUILD_CONTEXT:-..}
      dockerfile: ${ADMIN_DOCKERFILE:-googernew-main/docker/admin-app.Dockerfile}
    environment:
      NODE_ENV: production
      SERVE_NEXT: "true"
      PORT: 3002
      FRONTEND_URL: ${ADMIN_URL:-http://localhost:3002}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3002}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      CORS_ORIGIN: ${ADMIN_URL:-http://localhost:3002}
      BACKEND_URL: ${BACKEND_URL:-http://admin-app:3002}
      GOOGER_MAIN_API_URL: ${GOOGER_MAIN_API_URL:-http://main-backend:5000}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-googer}
      DB_USER: ${DB_USER:-googer}
      DB_PASSWORD: ${DB_PASSWORD:-googer_password_change_me}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_POOL_MAX: ${ADMIN_DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/googernew/public/uploads
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-googer-internal-dev-token}
      OPS_MONITOR_TOKEN: ${OPS_MONITOR_TOKEN:-googer-ops-monitor-token}
      WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-120}
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - main-uploads:/app/googernew/public/uploads:ro
    depends_on:
      main-backend:
        condition: service_started
      redis:
        condition: service_healthy

  admin-worker:
    build:
      context: ${ADMIN_BUILD_CONTEXT:-..}
      dockerfile: ${ADMIN_DOCKERFILE:-googernew-main/docker/admin-app.Dockerfile}
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-googer}
      DB_USER: ${DB_USER:-googer}
      DB_PASSWORD: ${DB_PASSWORD:-googer_password_change_me}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_POOL_MAX: ${ADMIN_WORKER_DB_POOL_MAX:-5}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-googer-internal-dev-token}
      OPS_MONITOR_TOKEN: ${OPS_MONITOR_TOKEN:-googer-ops-monitor-token}
      GOOGER_MAIN_API_URL: ${GOOGER_MAIN_API_URL:-http://main-backend:5000}
      WORKER_ID: ${ADMIN_WORKER_ID:-googer-admin-worker-1}
      BACKGROUND_WORKER_POLL_MS: ${BACKGROUND_WORKER_POLL_MS:-1000}
      BACKGROUND_WORKER_RETRY_MS: ${BACKGROUND_WORKER_RETRY_MS:-30000}
      DEACTIVATED_USER_CLEANUP_MS: ${DEACTIVATED_USER_CLEANUP_MS:-3600000}
    depends_on:
      admin-app:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  postgres-data:
  main-uploads:
