global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: main-backend
    metrics_path: /api/ops/prometheus
    static_configs:
      - targets: ['main-backend:5000']
    authorization:
      credentials: __OPS_MONITOR_TOKEN__

  - job_name: admin-app
    metrics_path: /api/ops/prometheus
    static_configs:
      - targets: ['admin-app:3002']
    authorization:
      credentials: __OPS_MONITOR_TOKEN__

  - job_name: notification-service
    metrics_path: /ops/prometheus
    static_configs:
      - targets: ['notification-service:5004']
    authorization:
      credentials: __OPS_MONITOR_TOKEN__

  - job_name: media-service
