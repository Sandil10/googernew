groups:
  - name: googer-runtime
    rules:
      - alert: MainBackendDown
        expr: up{job="main-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Main backend is unreachable

      - alert: AdminAppDown
        expr: up{job="admin-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Admin app is unreachable

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le, service)) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High p95 request latency detected

      - alert: Elevated5xxRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated 5xx error rate detected
